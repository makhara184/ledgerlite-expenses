<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LedgerLite — Expense & Budget Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>LedgerLite</h1>
        <p>Personal & Small Business Expense Tracker</p>
      </div>
      <div class="budget-box">
        <label>Monthly Budget ($): <input id="budgetInput" type="number" value="2500" min="100" /></label>
        <button class="btn" id="csvBtn">Export CSV</button>
      </div>
    </header>

    <section class="summary" id="summaryCards"></section>

    <section class="layout">
      <div class="card">
        <h2>Add Transaction</h2>
        <form id="txForm">
          <input id="txDesc" placeholder="Description (e.g., Cloud Hosting)" required />
          <input id="txAmount" type="number" min="0.01" step="0.01" placeholder="Amount" required />
          <select id="txCategory">
            <option>Operations</option>
            <option>Marketing</option>
            <option>Travel</option>
            <option>Software</option>
            <option>Food & Dining</option>
            <option>Other</option>
          </select>
          <input id="txDate" type="date" required />
          <button class="btn primary" type="submit">Add Expense</button>
        </form>
        <h3 style="margin-top:20px;">Category Breakdown</h3>
        <div id="categoryBars" class="bars"></div>
      </div>

      <div class="card">
        <h2>Recent Transactions</h2>
        <table>
          <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr></thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
